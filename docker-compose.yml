services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Bound to localhost: the API has no auth and can spend money.
    ports:
      - "127.0.0.1:8000:8000"
    # A stop waits for in-flight renders that are already paid for.
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      DATA_DIR: /data
    volumes:
      # Read-only: every write goes through the backend.
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
