[project]
name = "marketing-tools"
version = "0.1.0"
description = "Creator discovery and asset generation behind one MCP backend and one Streamlit frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.10",
    "google-api-python-client==2.187.0",
    "google-genai==2.16.0",
    "openai==2.52.0",
    "pandas",
    "pillow==12.0.0",
    "plotly==6.5.2",
    "python-dotenv==1.2.1",
    "streamlit==1.51.0",
]

[project.scripts]
backend = "backend.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
